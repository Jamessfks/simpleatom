name: Deploy to Hugging Face Space

# The Space is written only by this workflow (docs/adr/0002, 0026). It used to
# be reachable by hand-pushes too, and for a month production ran code from an
# unmerged branch; staging from git ls-files + rsync --delete makes the Space
# exactly the backend at the commit being deployed — no more, no less.

on:
  workflow_call:
    secrets:
      HF_TOKEN:
        required: true
  workflow_dispatch:

concurrency:
  group: hf-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: hf-production
    timeout-minutes: 45
    steps:
      # A manual run used to deploy whatever branch it was started from,
      # skipping the CI gates the workflow_call path requires (D50).
      - name: Refuse a manual deploy from any branch but main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Manual deploys run only from main (got ${{ github.ref }})."
          exit 1

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage the backend
        run: scripts/stage-hf-space.sh "$RUNNER_TEMP/stage"

      - name: Mirror the staged tree into the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git clone "https://Jamessfks:${HF_TOKEN}@huggingface.co/spaces/Jamessfks/mace-api" "$RUNNER_TEMP/hf-space"
          # --delete removes anything the commit does not contain (stale or
          # hand-pushed modules); the Space's own .git and LFS config stay.
          rsync -a --delete --exclude .git --exclude .gitattributes "$RUNNER_TEMP/stage/" "$RUNNER_TEMP/hf-space/"
          cd "$RUNNER_TEMP/hf-space"
          git add -A
          if git diff --staged --quiet; then echo "No changes to deploy"; exit 0; fi
          git commit -m "Auto-deploy from GitHub @ ${GITHUB_SHA::7}"
          git push

      - name: Wait for the Space to serve this commit
        run: |
          # The Space rebuilds the image after the push; a deploy only counts
          # once /health reports the SHA that was pushed (D3).
          for i in $(seq 1 80); do
            body=$(curl -fsS -m 10 https://jamessfks-mace-api.hf.space/health || true)
            echo "attempt $i: $body"
            if echo "$body" | grep -q "\"gitCommit\":\"${GITHUB_SHA}\""; then
              echo "Space is serving ${GITHUB_SHA}"; exit 0
            fi
            sleep 30
          done
          echo "::error::The Space did not report ${GITHUB_SHA} within 40 minutes."
          exit 1
