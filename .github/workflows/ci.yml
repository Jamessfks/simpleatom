name: CI

# Every push and pull request runs every gate (docs/adr/0026). Deploys to the
# Hugging Face Space happen only from main and only after all of them pass;
# Vercel deploys main on its own, so protect main with these checks.
#
# Actions are pinned by commit SHA (tag in the comment) so a moved tag cannot
# change what runs here.

on:
  push:
    branches: [main, daily, "v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KMP_DUPLICATE_LIB_OK: "TRUE"

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generated contract is up to date
        run: npm run check:contract
      - name: Version strings agree
        run: |
          node -e '
            const pkg = require("./package.json").version;
            const contract = require("./mace-api/contract.json").appVersion;
            if (pkg !== contract) { console.error(`package.json ${pkg} != contract.json ${contract}`); process.exit(1); }
            console.log(`version ${pkg}`);'
      - run: npm run typecheck
      - name: Lint (never above the recorded baseline)
        run: node scripts/lint-baseline.mjs
      - run: npm test
      - run: npm run build
      - name: No high or critical advisories in production dependencies
        run: npm audit --omit=dev --audit-level=high

  python-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mace-api/requirements.lock.txt
      - name: Install the exact locked backend
        run: pip install --require-hashes --no-deps -r mace-api/requirements.lock.txt
      - name: Contract, checkpoint trust, CLI refusal guards, shared fixtures
        run: python -m unittest discover -s test_scripts -p "test_backend_contract.py" -v
      - name: Optimizer and SMILES unit tests
        working-directory: mace-api
        run: python -m unittest test_geometry_opt test_smiles_to_xyz
      - name: Deploy staging ships every tracked backend file
        run: |
          scripts/stage-hf-space.sh "$RUNNER_TEMP/stage"
          for f in calculate.py contract.json contract.py jobs.py main.py provenance.py safe_load.py \
                   smiles_to_xyz.py validate_calculation.py requirements.lock.txt Dockerfile GIT_COMMIT; do
            test -f "$RUNNER_TEMP/stage/$f" || { echo "::error::$f missing from the staged Space"; exit 1; }
          done

  python-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mace-api/requirements.lock.txt
      - name: Cache MACE checkpoints (keyed on their pinned hashes)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mace
          key: mace-checkpoints-${{ hashFiles('mace-api/contract.json') }}
      - run: pip install --require-hashes --no-deps -r mace-api/requirements.lock.txt
      - name: Scientific validator self-test
        run: |
          python test_scripts/validate_calculation.py --test | tee validator.json
          python -c "import json,sys; t=open('validator.json').read(); d=json.loads(t[t.index('{'):]); sys.exit(0 if d['all_passed'] else 1)"
      - name: Provenance (golden energies, manifest, 40 tests)
        run: python -m unittest discover -s test_scripts -p "test_provenance.py" -v
      - name: Science regressions (D5, D6, D16, D18, MPA-0 pin, translation invariance)
        run: python -m unittest discover -s test_scripts -p "test_science_regressions.py" -v

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: python-unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image exactly as the Space will
        run: |
          scripts/stage-hf-space.sh "$RUNNER_TEMP/stage"
          docker build -t simpleatom-api "$RUNNER_TEMP/stage"
      - name: Serve it and check D2, D3, the pins and the refusals over HTTP
        run: |
          docker run -d --name api -p 7860:7860 simpleatom-api
          for i in $(seq 1 60); do curl -fsS localhost:7860/health && break; sleep 5; done
          curl -fsS localhost:7860/health | python -c "import json,sys; d=json.load(sys.stdin); assert d['gitCommit']=='${{ github.sha }}', d"
          curl -fsS -F files=@public/demo/ethanol.xyz -F 'params={"modelType":"MACE-OFF","modelSize":"small"}' \
            localhost:7860/calculate > result.json
          python - <<'PY'
          import json
          r = json.load(open("result.json"))
          assert r["validation"]["status"] == "ran", r["validation"]
          assert r["provenance"]["code"]["gitCommit"], "gitCommit missing from the manifest"
          print("ethanol E =", r["energy"])
          PY
          code() { curl -s -o /dev/null -w '%{http_code}' -F files=@public/demo/ethanol.xyz -F "params=$1" localhost:7860/calculate; }
          test "$(code '{"calculationType":"phonon"}')" = 400
          test "$(code '{"modelType":"MACE-MP-0","modelSize":"https://x.invalid/a.model"}')" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' -F files=@public/demo/ethanol.xyz -F 'params={}' -F model=@public/demo/ethanol.xyz localhost:7860/calculate)" = 403
      - if: failure()
        run: docker logs api | tail -100

  deploy-hf:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, python-unit, python-models, docker-smoke]
    uses: ./.github/workflows/deploy-hf-space.yml
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
